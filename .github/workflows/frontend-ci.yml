name: Frontend CI

# Lint, type-check (via tsc no `npm run build`) e bundle do frontend Vite + React.
# Roda em push para main e pull_request para main, mas APENAS quando algum
# arquivo dentro de frontend/ ou este proprio workflow muda - isso evita CI
# desnecessario em mudancas que so afetam o backend.
#
# NAO faz deploy. NAO roda em tags.
# Backend continua coberto por .github/workflows/ci.yml e .github/workflows/deploy.yml.

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  build:
    name: Build (Vite)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (reproducivel via package-lock)
        run: npm ci

      - name: Build (tsc + vite build)
        run: npm run build

      - name: Verifica que o bundle foi gerado
        run: |
          test -f dist/index.html
          test -d dist/assets
          ls -la dist
